<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527FFF"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1200" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">AWS Global Accelerator — Multi-Region Architecture</text>
  <text x="600" y="58" font-size="14" fill="#555555" text-anchor="middle">Static Anycast IPs · AWS global backbone · automatic cross-region failover</text>

  <!-- Users -->
  <g>
    <rect x="60" y="96" width="70" height="46" rx="4" fill="none" stroke="#232F3E" stroke-width="2"/>
    <rect x="70" y="106" width="50" height="26" fill="none" stroke="#232F3E" stroke-width="1.5"/>
    <line x1="80" y1="142" x2="120" y2="142" stroke="#232F3E" stroke-width="2"/>
    <text x="95" y="88" font-size="13" fill="#232F3E" text-anchor="middle">Users</text>
    <text x="95" y="164" font-size="12" fill="#232F3E" text-anchor="middle">global clients</text>
  </g>

  <!-- Arrow: Users -> Route 53 -->
  <line x1="132" y1="119" x2="198" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="108" font-size="11" fill="#555555" text-anchor="middle">DNS query</text>

  <!-- Route 53 -->
  <g>
    <rect x="200" y="91" width="56" height="56" fill="#8C4FFF"/>
    <text x="228" y="116" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">53</text>
    <text x="228" y="134" font-size="11" fill="#ffffff" text-anchor="middle">Route 53</text>
    <text x="228" y="164" font-size="13" fill="#232F3E" text-anchor="middle">Amazon Route 53</text>
    <text x="228" y="181" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">DNS — resolves to static IPs</text>
  </g>

  <!-- Arrow: Route 53 -> Global Accelerator -->
  <line x1="258" y1="119" x2="324" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="291" y="108" font-size="11" fill="#555555" text-anchor="middle">2 static IPs</text>

  <!-- Global Accelerator -->
  <g>
    <rect x="326" y="91" width="56" height="56" fill="#8C4FFF"/>
    <circle cx="354" cy="119" r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="354" cy="119" r="6" fill="#ffffff"/>
    <text x="354" y="164" font-size="13" fill="#232F3E" text-anchor="middle">AWS Global Accelerator</text>
    <text x="354" y="181" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Anycast · 2 static IPv4 addresses</text>
  </g>

  <!-- Arrow: GA -> Edge locations -->
  <line x1="384" y1="119" x2="450" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="417" y="108" font-size="11" fill="#555555" text-anchor="middle">nearest edge</text>

  <!-- Edge locations -->
  <g>
    <rect x="452" y="91" width="56" height="56" fill="#8C4FFF"/>
    <text x="480" y="125" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EDGE</text>
    <text x="480" y="164" font-size="13" fill="#232F3E" text-anchor="middle">AWS Edge Locations</text>
    <text x="480" y="181" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">100+ on-ramps worldwide</text>
  </g>

  <!-- Arrow: Edge -> AWS backbone -->
  <line x1="510" y1="119" x2="576" y2="119" stroke="#527FFF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="543" y="108" font-size="11" fill="#527FFF" text-anchor="middle">backbone</text>

  <!-- AWS global backbone label -->
  <g>
    <rect x="578" y="91" width="180" height="56" rx="6" fill="#EAF1FF" stroke="#527FFF" stroke-width="2"/>
    <text x="668" y="116" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">AWS Global Network</text>
    <text x="668" y="136" font-size="12" fill="#555555" text-anchor="middle">private backbone — no public internet</text>
  </g>

  <!-- WAF / Shield -->
  <g>
    <rect x="800" y="91" width="56" height="56" fill="#D13239"/>
    <text x="828" y="125" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">WAF</text>
    <text x="828" y="164" font-size="13" fill="#232F3E" text-anchor="middle">AWS WAF + Shield</text>
    <text x="828" y="181" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">DDoS &amp; L7 protection</text>
  </g>

  <!-- Arrow: backbone -> WAF -->
  <line x1="760" y1="119" x2="798" y2="119" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: WAF -> CloudWatch (monitoring, top right) -->
  <g>
    <rect x="980" y="91" width="56" height="56" fill="#FF9900"/>
    <text x="1008" y="117" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Cloud</text>
    <text x="1008" y="131" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Watch</text>
    <text x="1008" y="164" font-size="13" fill="#232F3E" text-anchor="middle">Amazon CloudWatch</text>
    <text x="1008" y="181" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">endpoint health alarms</text>
  </g>
  <line x1="858" y1="119" x2="978" y2="119" stroke="#444444" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="918" y="108" font-size="11" fill="#555555" text-anchor="middle">metrics</text>

  <!-- ============ REGION us-east-1 ============ -->
  <g>
    <rect x="40" y="230" width="540" height="400" fill="#F2F8F2" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="8,5"/>
    <text x="60" y="256" font-size="15" font-weight="bold" fill="#1B660F">Region: us-east-1 (N. Virginia) — PRIMARY · traffic dial 100%</text>

    <!-- AZ a -->
    <rect x="60" y="270" width="240" height="340" fill="none" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="72" y="292" font-size="13" font-weight="bold" fill="#1B660F">Availability Zone us-east-1a</text>

    <!-- Public subnet -->
    <rect x="72" y="302" width="216" height="130" fill="#D5DBDB" stroke="#5A6C7D" stroke-width="1.5"/>
    <text x="84" y="322" font-size="12" font-weight="bold" fill="#232F3E">Public subnet 10.0.1.0/24</text>
    <!-- ALB -->
    <rect x="120" y="336" width="120" height="44" fill="#8C4FFF"/>
    <text x="180" y="354" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ALB</text>
    <text x="180" y="370" font-size="11" fill="#ffffff" text-anchor="middle">Application LB</text>
    <text x="180" y="414" font-size="12" fill="#232F3E" text-anchor="middle">Endpoint · health-checked</text>

    <!-- Private subnet -->
    <rect x="72" y="446" width="216" height="150" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
    <text x="84" y="466" font-size="12" font-weight="bold" fill="#232F3E">Private subnet 10.0.11.0/24</text>
    <!-- EC2 -->
    <rect x="96" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="132" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="132" y="512" font-size="11" fill="#ffffff" text-anchor="middle">app servers</text>
    <!-- ECS -->
    <rect x="192" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="228" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ECS</text>
    <text x="228" y="512" font-size="11" fill="#ffffff" text-anchor="middle">containers</text>
    <text x="180" y="548" font-size="12" fill="#232F3E" text-anchor="middle">Compute tier (no public IPs)</text>
    <!-- RDS -->
    <rect x="120" y="556" width="120" height="30" fill="#3B48CC"/>
    <text x="180" y="575" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS · db subnet</text>

    <!-- AZ b -->
    <rect x="320" y="270" width="240" height="340" fill="none" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="332" y="292" font-size="13" font-weight="bold" fill="#1B660F">Availability Zone us-east-1b</text>
    <rect x="332" y="302" width="216" height="130" fill="#D5DBDB" stroke="#5A6C7D" stroke-width="1.5"/>
    <text x="344" y="322" font-size="12" font-weight="bold" fill="#232F3E">Public subnet 10.0.2.0/24</text>
    <rect x="380" y="336" width="120" height="44" fill="#8C4FFF"/>
    <text x="440" y="354" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ALB</text>
    <text x="440" y="370" font-size="11" fill="#ffffff" text-anchor="middle">Application LB</text>
    <text x="440" y="414" font-size="12" fill="#232F3E" text-anchor="middle">Endpoint · health-checked</text>
    <rect x="332" y="446" width="216" height="150" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
    <text x="344" y="466" font-size="12" font-weight="bold" fill="#232F3E">Private subnet 10.0.12.0/24</text>
    <rect x="356" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="392" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="392" y="512" font-size="11" fill="#ffffff" text-anchor="middle">app servers</text>
    <rect x="452" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="488" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ECS</text>
    <text x="488" y="512" font-size="11" fill="#ffffff" text-anchor="middle">containers</text>
    <text x="440" y="548" font-size="12" fill="#232F3E" text-anchor="middle">Compute tier (no public IPs)</text>
    <rect x="380" y="556" width="120" height="30" fill="#3B48CC"/>
    <text x="440" y="575" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS · db subnet</text>
  </g>

  <!-- ============ REGION eu-west-1 ============ -->
  <g>
    <rect x="620" y="230" width="540" height="400" fill="#F2F8F2" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="8,5"/>
    <text x="640" y="256" font-size="15" font-weight="bold" fill="#1B660F">Region: eu-west-1 (Ireland) — SECONDARY · traffic dial 0%</text>

    <!-- AZ a -->
    <rect x="640" y="270" width="240" height="340" fill="none" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="652" y="292" font-size="13" font-weight="bold" fill="#1B660F">Availability Zone eu-west-1a</text>
    <rect x="652" y="302" width="216" height="130" fill="#D5DBDB" stroke="#5A6C7D" stroke-width="1.5"/>
    <text x="664" y="322" font-size="12" font-weight="bold" fill="#232F3E">Public subnet 10.1.1.0/24</text>
    <rect x="700" y="336" width="120" height="44" fill="#8C4FFF"/>
    <text x="760" y="354" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ALB</text>
    <text x="760" y="370" font-size="11" fill="#ffffff" text-anchor="middle">Application LB</text>
    <text x="760" y="414" font-size="12" fill="#232F3E" text-anchor="middle">Endpoint · health-checked</text>
    <rect x="652" y="446" width="216" height="150" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
    <text x="664" y="466" font-size="12" font-weight="bold" fill="#232F3E">Private subnet 10.1.11.0/24</text>
    <rect x="676" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="712" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="712" y="512" font-size="11" fill="#ffffff" text-anchor="middle">app servers</text>
    <rect x="772" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="808" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ECS</text>
    <text x="808" y="512" font-size="11" fill="#ffffff" text-anchor="middle">containers</text>
    <text x="760" y="548" font-size="12" fill="#232F3E" text-anchor="middle">Compute tier (no public IPs)</text>
    <rect x="700" y="556" width="120" height="30" fill="#3B48CC"/>
    <text x="760" y="575" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS · db subnet</text>

    <!-- AZ b -->
    <rect x="900" y="270" width="240" height="340" fill="none" stroke="#1B660F" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="912" y="292" font-size="13" font-weight="bold" fill="#1B660F">Availability Zone eu-west-1b</text>
    <rect x="912" y="302" width="216" height="130" fill="#D5DBDB" stroke="#5A6C7D" stroke-width="1.5"/>
    <text x="924" y="322" font-size="12" font-weight="bold" fill="#232F3E">Public subnet 10.1.2.0/24</text>
    <rect x="960" y="336" width="120" height="44" fill="#8C4FFF"/>
    <text x="1020" y="354" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ALB</text>
    <text x="1020" y="370" font-size="11" fill="#ffffff" text-anchor="middle">Application LB</text>
    <text x="1020" y="414" font-size="12" fill="#232F3E" text-anchor="middle">Endpoint · health-checked</text>
    <rect x="912" y="446" width="216" height="150" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
    <text x="924" y="466" font-size="12" font-weight="bold" fill="#232F3E">Private subnet 10.1.12.0/24</text>
    <rect x="936" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="972" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="972" y="512" font-size="11" fill="#ffffff" text-anchor="middle">app servers</text>
    <rect x="1032" y="478" width="72" height="44" fill="#FF9900"/>
    <text x="1068" y="496" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ECS</text>
    <text x="1068" y="512" font-size="11" fill="#ffffff" text-anchor="middle">containers</text>
    <text x="1020" y="548" font-size="12" fill="#232F3E" text-anchor="middle">Compute tier (no public IPs)</text>
    <rect x="960" y="556" width="120" height="30" fill="#3B48CC"/>
    <text x="1020" y="575" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS · db subnet</text>
  </g>

  <!-- Traffic arrows from backbone down into regions -->
  <line x1="668" y1="150" x2="668" y2="225" stroke="#527FFF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="676" y="195" font-size="11" fill="#527FFF">accelerated traffic</text>
  <line x1="310" y1="210" x2="180" y2="225" stroke="#527FFF" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="880" y1="210" x2="880" y2="225" stroke="#527FFF" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="888" y="205" font-size="11" fill="#527FFF">standby — dial 0%</text>

  <!-- In-region flow arrows -->
  <line x1="180" y1="432" x2="180" y2="444" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="432" x2="440" y2="444" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="432" x2="760" y2="444" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="432" x2="1020" y2="444" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ElastiCache + S3 strip -->
  <g>
    <rect x="40" y="660" width="540" height="90" fill="#EAF5EA" stroke="#1B660F" stroke-width="1.5"/>
    <text x="60" y="686" font-size="13" font-weight="bold" fill="#232F3E">Data &amp; caching (us-east-1)</text>
    <rect x="60" y="696" width="150" height="36" fill="#3B48CC"/>
    <text x="135" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ElastiCache (Redis)</text>
    <rect x="230" y="696" width="150" height="36" fill="#3B48CC"/>
    <text x="305" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS Multi-AZ</text>
    <rect x="400" y="696" width="150" height="36" fill="#3D9C33"/>
    <text x="475" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S3 — static assets</text>
  </g>
  <g>
    <rect x="620" y="660" width="540" height="90" fill="#EAF5EA" stroke="#1B660F" stroke-width="1.5"/>
    <text x="640" y="686" font-size="13" font-weight="bold" fill="#232F3E">Data &amp; caching (eu-west-1)</text>
    <rect x="640" y="696" width="150" height="36" fill="#3B48CC"/>
    <text x="715" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ElastiCache (Redis)</text>
    <rect x="810" y="696" width="150" height="36" fill="#3B48CC"/>
    <text x="885" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS Multi-AZ</text>
    <rect x="980" y="696" width="150" height="36" fill="#3D9C33"/>
    <text x="1055" y="718" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S3 — static assets</text>
  </g>

  <!-- Failover note -->
  <g>
    <rect x="40" y="790" width="1120" height="110" fill="#FFF8E6" stroke="#B9770E" stroke-width="1.5"/>
    <text x="60" y="818" font-size="14" font-weight="bold" fill="#232F3E">How failover works (no human in the loop)</text>
    <text x="60" y="842" font-size="13" fill="#232F3E">1. Global Accelerator health-checks every endpoint every few seconds. An ALB that stops answering is removed from routing in ~30 seconds.</text>
    <text x="60" y="864" font-size="13" fill="#232F3E">2. If the whole us-east-1 endpoint group fails, the traffic dial shifts 100% of traffic to eu-west-1 automatically — clients keep the same static IPs.</text>
    <text x="60" y="886" font-size="13" fill="#232F3E">3. New connections land on the healthy region; existing TCP connections to the failed region are drained. No DNS change, no TTL wait.</text>
  </g>

  <!-- Legend -->
  <g>
    <text x="40" y="940" font-size="13" font-weight="bold" fill="#232F3E">Legend:</text>
    <rect x="110" y="928" width="18" height="14" fill="#FF9900"/>
    <text x="134" y="940" font-size="12" fill="#232F3E">Compute (EC2 / ECS)</text>
    <rect x="290" y="928" width="18" height="14" fill="#3B48CC"/>
    <text x="314" y="940" font-size="12" fill="#232F3E">Database / Cache (RDS / ElastiCache)</text>
    <rect x="540" y="928" width="18" height="14" fill="#3D9C33"/>
    <text x="564" y="940" font-size="12" fill="#232F3E">Storage (S3)</text>
    <rect x="690" y="928" width="18" height="14" fill="#8C4FFF"/>
    <text x="714" y="940" font-size="12" fill="#232F3E">Networking (Route 53 / GA / ALB)</text>
    <rect x="960" y="928" width="18" height="14" fill="#D13239"/>
    <text x="984" y="940" font-size="12" fill="#232F3E">Security (WAF / Shield)</text>
  </g>
</svg>
